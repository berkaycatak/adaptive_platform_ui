name: adaptive_platform_ui_example
description: Example app demonstrating adaptive_platform_ui package
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.9.2
  flutter: ">=1.17.0"


dependencies:
  go_router: ^17.5.0
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  adaptive_platform_ui:
    path: ../
  flutter:
    sdk: flutter
  # cupertino: ^0.0.1
  flutter_localizations:
    sdk: flutter

  cupertino_ui: any
  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
